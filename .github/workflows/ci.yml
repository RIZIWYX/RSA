name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install -y dune zarith
      - name: Compilation
        run: opam exec -- dune build
      - name: Tests
        run: opam exec -- dune exec test/main.exe
